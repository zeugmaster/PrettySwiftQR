name: PrettySwiftQRExample
options:
  bundleIdPrefix: dev.zeugmaster
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  PrettySwiftQR:
    path: ..
targets:
  PrettySwiftQRExample:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: PrettySwiftQR
        product: PrettySwiftQR
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: PrettyQR
        NSCameraUsageDescription: The camera is used to scan QR codes.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
  PrettySwiftQRExampleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: PrettySwiftQRExample
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: true
